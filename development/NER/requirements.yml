name: torch24_spacy_gpu
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python (IMPORTANT: not 3.13)
  - python=3.12

  # Core tools
  - pip
  - setuptools<82
  - wheel

  # PyTorch (CUDA 12.1, stable)
  - pytorch=2.4.1
  - torchvision=0.19.1
  - torchaudio=2.4.1
  - pytorch-cuda=12.1

  # Optional but useful
  - numpy
  - scipy

  # Pip section for spaCy + HF stack
  - pip:
      # spaCy + GPU backend
      - spacy==3.8.2
      - cupy-cuda12x

      # spaCy transformers integration
      - spacy-transformers>=1.3,<1.5
      - spacy-alignments>=0.9,<1.0

      # HuggingFace (compatible with torch 2.4)
      - transformers>=4.40,<4.44
      - tokenizers>=0.15,<0.20
      - safetensors>=0.4,<0.5

      # Utilities
      - filelock>=3.13,<4
      - fsspec>=2023.6,<2025
      - pyyaml>=6.0,<7
      - regex>=2023.6,<2025
      - pillow>=10,<11
      - networkx>=3.1,<4
      - sympy>=1.12,<2

      # Optional (comment out if issues)
      # - triton==2.1.0